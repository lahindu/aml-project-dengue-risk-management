
name: Train Model and Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: lahindu/dengue-web
  IMAGE_TAG: "1.0"

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      # Install dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      # Train ML model
      - name: Train dengue prediction model
        run: |
          cd src
          python main.py

      # Replace model and dataset in web directory
      - name: Update web application files
        run: |
          cp src/srilanka_dengue_ebm_model.pkl web/
          cp src/srilanka_dengue_weekly_by_district.csv web/

      # Docker Hub login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          cd web
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$IMAGE_TAG
