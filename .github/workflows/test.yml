name: Deploy to Azure Container Apps

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Docker Hub image to deploy"
        required: true
        default: "docker.io/lahindu/dengue-web:1.0"

permissions:
  id-token: write
  contents: read

env:
  APP_NAME: ${{ secrets.AZURE_CONTAINER_APP }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  # Container Apps environment and region (must be a region that your subscription allows)
  ENVIRONMENT_NAME: ${{ secrets.AZURE_CONTAINER_ENV || 'dengue-web-env' }}
  LOCATION: ${{ secrets.AZURE_LOCATION || 'centralindia' }}
  IMAGE: ${{ github.event.inputs.image }}
  TARGET_PORT: "8000"

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Add the Container Apps extension
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az extension add --name containerapp --upgrade --only-show-errors

      - name: Create the Container Apps environment (only if it does not exist)
        run: |
          if az containerapp env show --name "$ENVIRONMENT_NAME" --resource-group "$RESOURCE_GROUP" > /dev/null 2>&1; then
            echo "Environment exists."
          else
            echo "Creating the environment in $LOCATION ..."
            az containerapp env create \
              --name "$ENVIRONMENT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --logs-destination none \
              --only-show-errors
          fi

      - name: Create or update the container app
        run: |
          if az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" > /dev/null 2>&1; then
            echo "App exists. Deploying the new image ..."
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --only-show-errors -o none
          else
            echo "Creating the app ..."
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ENVIRONMENT_NAME" \
              --image "$IMAGE" \
              --cpu 1.0 \
              --memory 2.0Gi \
              --min-replicas 0 \
              --max-replicas 2 \
              --env-vars PORT="$TARGET_PORT" WEB_CONCURRENCY=2 \
              --ingress external \
              --target-port "$TARGET_PORT" \
              --only-show-errors -o none
          fi

      - name: Expose the app publicly
        run: |
          az containerapp ingress enable \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --type external \
            --target-port "$TARGET_PORT" \
            --transport auto \
            --only-show-errors -o none

      - name: Smoke test and show the public URL
        run: |
          FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                 --query properties.configuration.ingress.fqdn -o tsv)
          URL="https://$FQDN"
          # the app can be scaled to zero, so the first request can take some time
          for i in $(seq 1 20); do
            if curl -fsS "$URL/api/districts" > /dev/null; then
              echo "The app answers."
              break
            fi
            echo "Waiting for the app ($i/20) ..."
            sleep 15
          done
          curl -fsS "$URL/api/districts" > /dev/null
          echo "Public URL: $URL"
          echo "### Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
